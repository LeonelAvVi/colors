    <script>
        document.getElementById('test-form').addEventListener('submit', function(event) {
            event.preventDefault(); // Evita el envío tradicional del formulario

            const formContainer = document.getElementById('form-container');
            const submitButton = document.getElementById('save-pdf-btn');
            const contactButton = document.getElementById('contact-button-school');
            const whatsappButton = document.getElementById('send-message-whatsapp');

            // Oculta el botón para que no aparezca en la captura del PDF
            submitButton.style.display = 'none';
            contactButton.style.display = 'none';
            whatsappButton.style.display = 'none';

            // Captura el elemento del formulario y lo convierte en un canvas (imagen)
            html2canvas(formContainer, { scale: 2 }).then(canvas => {
                // Restaura el botón a su estado original
                submitButton.style.display = 'block';
                contactButton.style.display = 'block';
                whatsappButton.style.display = 'block';

                // Convierte el canvas a una URL de imagen base64
                const imgData = canvas.toDataURL('image/png');
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4'); // 'p' = portrait, 'mm' = milímetros, 'a4' = tamaño de página
                
                // Obtiene las propiedades de la imagen para ajustar el tamaño en el PDF
                const imgProps = pdf.getImageProperties(imgData);
                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;

                // Añade la imagen al documento PDF
                pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
                
                // Guarda el archivo PDF en el dispositivo del usuario
                pdf.save("formulario_de_registro.pdf");

                // Muestra una alerta de confirmación
                setTimeout(() => {
                    alert('¡El formulario se ha guardado como PDF con éxito!');
                }, 500);

                // Opcional: Limpia los campos del formulario
                this.reset();
            });
        });
    </script>

    <script>
        function sendWhatsApp() {
        // 📩 Obtener los valores del formulario
        const email = document.getElementById("name").value;
        const firstName = document.getElementById("first-name").value;
        const surname = document.getElementById("surname").value;

        const city = document.getElementById("city").value;
        const state = document.getElementById("state").value;
        const country = document.getElementById("country").value;
        const studentLevel = document.querySelector("select").value;

        // 🧾 Crear el mensaje
        const message = `📋 *Student Registration Information*:
        ───────────────────────────────
        👤 *Full Name:* ${firstName} ${surname}
        📧 *Email:* ${email}

        📱 *Cell Number:* +${countryCode} ${areaCode} ${cellNumber}
        🎂 *Date of Birth:* ${dob}

        🏠 *Address:*
        - City: ${city}
        - State/Province: ${state}
        - Country: ${country}

        📚 *Student Level:* ${studentLevel}
        ───────────────────────────────
        Please confirm the information above.`;

        // 🔗 Crear el enlace de WhatsApp (pon tu número aquí con código país sin “+”)
        const phoneNumber = "59175451699"; // ← Cambia por el número destino, ej. 59171234567
        const url = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;

        // 🚀 Abrir WhatsApp
        window.open(url, "_blank");
        }
